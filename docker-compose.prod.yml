name: mypath-prod

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mypath_backend_prod
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env.prod
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.mypath.com}
    container_name: mypath_frontend_prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
