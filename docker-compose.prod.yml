name: mypath-prod

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mypath_backend_prod
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - PORT=5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: mypath_frontend_prod
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_INTERNAL_URL=http://backend:5000
    depends_on:
      - backend