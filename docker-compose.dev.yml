services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: mypath_backend_dev
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
    volumes:
      - ./backend:/app
      # Anonymous volume preserves container's installed node_modules from being overwritten by the host
      - /app/node_modules
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mypath_frontend_dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BACKEND_INTERNAL_URL=http://backend:5000
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      # Enables polling for fast refresh inside Docker across different OS file systems
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    stdin_open: true
    tty: true